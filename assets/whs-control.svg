<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Hospitality hazard control pathway</title><desc id="desc">A four-step pathway: identify the hazard, assess the risk, control the risk using the strongest practical control, then review and report.</desc><rect width="900" height="480" rx="24" fill="#f3f8f8"/><text x="450" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#073d48">Hazard control is a loop, not a one-off glance</text><g font-family="Segoe UI,Arial"><g transform="translate(45 105)"><rect width="180" height="190" rx="18" fill="#0b5261"/><circle cx="90" cy="55" r="31" fill="#d9ab3d"/><text x="90" y="64" text-anchor="middle" font-size="25" font-weight="800" fill="#073d48">1</text><text x="90" y="115" text-anchor="middle" font-size="21" font-weight="700" fill="white">Identify</text><text x="90" y="143" text-anchor="middle" font-size="15" fill="#e5f1f2">What could cause harm?</text><text x="90" y="168" text-anchor="middle" font-size="14" fill="#e5f1f2">Spill · heat · blade · lead</text></g><g transform="translate(255 105)"><rect width="180" height="190" rx="18" fill="#0f6878"/><circle cx="90" cy="55" r="31" fill="#d9ab3d"/><text x="90" y="64" text-anchor="middle" font-size="25" font-weight="800" fill="#073d48">2</text><text x="90" y="115" text-anchor="middle" font-size="21" font-weight="700" fill="white">Assess</text><text x="90" y="143" text-anchor="middle" font-size="15" fill="#e5f1f2">Who could be harmed?</text><text x="90" y="168" text-anchor="middle" font-size="14" fill="#e5f1f2">How likely and serious?</text></g><g transform="translate(465 105)"><rect width="180" height="190" rx="18" fill="#167f8f"/><circle cx="90" cy="55" r="31" fill="#d9ab3d"/><text x="90" y="64" text-anchor="middle" font-size="25" font-weight="800" fill="#073d48">3</text><text x="90" y="115" text-anchor="middle" font-size="21" font-weight="700" fill="white">Control</text><text x="90" y="143" text-anchor="middle" font-size="15" fill="white">Remove first if possible</text><text x="90" y="168" text-anchor="middle" font-size="14" fill="white">Then minimise the risk</text></g><g transform="translate(675 105)"><rect width="180" height="190" rx="18" fill="#1e7180"/><circle cx="90" cy="55" r="31" fill="#d9ab3d"/><text x="90" y="64" text-anchor="middle" font-size="25" font-weight="800" fill="#073d48">4</text><text x="90" y="115" text-anchor="middle" font-size="21" font-weight="700" fill="white">Review</text><text x="90" y="143" text-anchor="middle" font-size="15" fill="#e5f1f2">Did the control work?</text><text x="90" y="168" text-anchor="middle" font-size="14" fill="#e5f1f2">Report and monitor</text></g><g fill="#d9ab3d"><path d="M225 190h25l-10-10 8-8 24 24-24 24-8-8 10-10h-25z"/><path d="M435 190h25l-10-10 8-8 24 24-24 24-8-8 10-10h-25z"/><path d="M645 190h25l-10-10 8-8 24 24-24 24-8-8 10-10h-25z"/></g><path d="M765 315v55H135v-55" fill="none" stroke="#0b5261" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 12"/><path d="M135 315l-13 18h26z" fill="#0b5261"/><rect x="157" y="395" width="586" height="49" rx="15" fill="#fff5d8" stroke="#d9ab3d"/><text x="450" y="426" text-anchor="middle" font-size="17" font-weight="700" fill="#5f4811">If you cannot safely fix it: stop, isolate if trained, and report through the workplace procedure.</text></g></svg>
