<title id="task-4-06-espresso-workflow-title">Espresso workflow: confirm, prepare, extract, texture and serve</title>
<desc id="task-4-06-espresso-workflow-desc">Eight-frame espresso workflow follows a confirmed order through station preparation, coffee preparation, extraction observation, milk texturing, presentation, handover and cleaning, with recipe and stop-or-report decision points. Large sequential frames for confirm, prepare, grind and prepare coffee, extract and observe, select and texture milk, combine, verify and serve, and clean and report. Each frame includes a decision icon rather than a numeric setting.</desc>
