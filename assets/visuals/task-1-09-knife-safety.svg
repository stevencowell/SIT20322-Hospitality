<title id="task-1-09-knife-safety-title">The visible knife pathway</title>
<desc id="task-1-09-knife-safety-desc">A knife remains visible and controlled from selection through cutting, washing and storage, while damage and maintenance are referred to the teacher. A top-view station traces one knife from storage to stable board, controlled cutting zone, visible temporary rest, separate wash point and secure storage. Red crossed paths show bench edge, hidden sink, crowded board and attempted catch. Maintenance exits to Teacher confirmation.</desc>
