<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-1-15-storage-temperature-title task-1-15-storage-temperature-desc" data-layout="cross-section">
<title id="task-1-15-storage-temperature-title">Identity, separation, rotation and temperature in one storage check</title>
<desc id="task-1-15-storage-temperature-desc">Storage zones protect food through identification, separation, rotation, airflow and current temperature monitoring, with failed controls isolated and reported. A neutral cross-section of dry, chilled and frozen storage zones shows readable labels, protected containers, raw-to-ready separation, stock rotation arrows, airflow space and a monitoring point. Every failed check exits to Isolate, Notify, Correct and Record.</desc>
