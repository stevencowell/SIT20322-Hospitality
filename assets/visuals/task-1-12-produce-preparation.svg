<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-1-12-produce-preparation-title task-1-12-produce-preparation-desc" data-layout="zone-flow">
<title id="task-1-12-produce-preparation-title">Fresh produce from receiving state to protected preparation</title>
<desc id="task-1-12-produce-preparation-desc">Fresh produce moves from inspection and washing through controlled trimming and cutting into a protected ready-to-use container. A left-to-right path separates Inspect, Dirty-side wash, Clean trim, Demonstrated cut, Portion and Protected ready-to-use container. Arrows for hands, boards, waste and splash show where contamination can move backwards and where controls break it.</desc>
