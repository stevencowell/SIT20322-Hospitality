<title id="task-1-11-mise-en-place-title">Turn recipe information into mise en place</title>
<desc id="task-1-11-mise-en-place-desc">Recipe details are translated into yield, preparation, equipment, timing, safety and presentation decisions that form an organised station. A mock generic recipe document feeds six colour-coded outputs: Yield check, Ingredient preparation, Equipment, Timing dependencies, Safety controls and Presentation. These outputs arrange into a top-view station with clean work, ingredients, tools, waste and finished-product zones.</desc>
