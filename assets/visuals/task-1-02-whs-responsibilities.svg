<title id="task-1-02-whs-responsibilities-title">Who acts, who decides and who must know</title>
<desc id="task-1-02-whs-responsibilities-desc">Learner actions, authorised decisions and shared communication connect across common kitchen safety situations. Three connected columns show Learner actions, Responsible-person decisions and Shared communication. Scenario arrows for training, faulty equipment, incident and procedure change demonstrate how responsibility moves without being abandoned.</desc>
