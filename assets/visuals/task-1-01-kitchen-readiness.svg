<title id="task-1-01-kitchen-readiness-title">The whole-job kitchen pre-start</title>
<desc id="task-1-01-kitchen-readiness-desc">Four connected pre-start lanes for task, person, place and process lead to a start or stop decision, followed by monitoring and an honest record. A horizontal four-lane map for Task, Person, Place and Process. Each lane contains two observable checks and feeds into a central Start, Stop and Confirm decision. A final arrow leads to Monitor during work and Record after work.</desc>
