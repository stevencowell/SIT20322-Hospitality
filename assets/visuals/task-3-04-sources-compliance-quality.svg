<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-3-04-sources-compliance-quality-title task-3-04-sources-compliance-quality-desc" data-layout="source-quality">
<title id="task-3-04-sources-compliance-quality-title">Sources, compliance and quality</title>
<desc id="task-3-04-sources-compliance-quality-desc">Hospitality source router testing authority, currency, jurisdiction, relevance and traceability before information enters a quality loop of standard, observation, authorised action and follow-up. A fictional workplace question enters a source router with lanes for regulator, industry or research, training, supplier or experienced person, and workplace procedure. Each lane passes through authority, currency, jurisdiction, relevance and traceability gates before joining a quality loop of standard, observation, authorised action and check-back.</desc>
