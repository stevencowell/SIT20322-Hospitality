<title id="task-2-06-orders-title">Take bookings and orders with a closed communication loop</title>
<desc id="task-2-06-orders-desc">Booking and order workflows show listening, recording, clarification, repeat-back, internal handover and correction of uncertainty. Left: booking call with highlighted fields. Right: table order with seat numbers, modification and an escalation flag. Arrows return for repeat-back and query resolution.</desc>
