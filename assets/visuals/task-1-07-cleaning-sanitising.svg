<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-1-07-cleaning-sanitising-title task-1-07-cleaning-sanitising-desc" data-layout="dual-lane">
<title id="task-1-07-cleaning-sanitising-title">From visible soil to a controlled food-contact surface</title>
<desc id="task-1-07-cleaning-sanitising-desc">Cleaning and sanitising sequence aligned with chemical-safety checks and a stop-and-report branch for unknown products. The upper lane shows Clear, Clean, Rinse if directed, Sanitise as directed, Dry and Verify. The lower safety lane aligns Product approved, Label and SDS checked, PPE fitted, Food protected, Clean and dirty zones separated, Result recorded. A warning branch captures unknown or unlabelled chemical.</desc>
