<title id="task-3-06-industry-brief-share-title">Build, share and improve an industry brief</title>
<desc id="task-3-06-industry-brief-share-desc">Six-step hospitality industry brief storyboard moving from question and three-source matrix to synthesis, workplace effect and authorised action, then looping colleague questions back to source checking and revision. Six projection-readable panels move from focused question and audience to a three-column evidence matrix, synthesis, workplace effect, authorised recommendation and colleague share-back. A curved feedback arrow returns from open and closed probe questions to source check and revision.</desc>
