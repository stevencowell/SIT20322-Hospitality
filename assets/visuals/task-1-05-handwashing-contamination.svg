<title id="task-1-05-handwashing-contamination-title">How a clean hand or glove becomes contaminated again</title>
<desc id="task-1-05-handwashing-contamination-desc">Common touchpoints transfer contamination through hands or gloves to ready-to-eat food, with hygiene controls breaking each pathway. A central hand-and-glove illustration connects common touchpoints such as raw food, face and hair, phone, waste, cleaning and money to a ready-to-eat product. Break points show report, wash and dry, change gloves, replace equipment and separate the work zone.</desc>
