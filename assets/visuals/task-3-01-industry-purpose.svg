<title id="task-3-01-industry-purpose-title">Industry information with a purpose</title>
<desc id="task-3-01-industry-purpose-desc">Research funnel turning a broad hospitality topic into a role-specific question, then separating the sourced fact, workplace meaning, authorised action and limitation. A broad hospitality topic enters a three-stage funnel labelled role or context, workplace decision and source authority. The output is a compact evidence card with separate rows for fact, meaning, action and limitation.</desc>
