<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-2-07-inclusive-title task-2-07-inclusive-desc" data-layout="inclusive-choice">
<title id="task-2-07-inclusive-title">Provide culturally respectful and disability-inclusive service</title>
<desc id="task-2-07-inclusive-desc">Inclusive hospitality service pathway asks the customer, offers communication or access options, checks authority and confirms what works. A central customer speech bubble leads to ask, listen, offer options, check authority and confirm suitability. Four side examples show plain language, time, access and greeting preference.</desc>
