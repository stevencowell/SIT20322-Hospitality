<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-1-06-food-handler-health-title task-1-06-food-handler-health-desc" data-layout="flow-privacy">
<title id="task-1-06-food-handler-health-title">When health changes during food work</title>
<desc id="task-1-06-food-handler-health-desc">Food-handler health concerns lead to stopping work, protecting food, factual reporting and an authorised duty decision, while private medical information stays protected. A decision flow begins with symptom, wound or respiratory event, then moves through Stop handling, Protect affected food, Report facts, Authorised duty decision and Return only when directed. A privacy shield diverts diagnoses and medical documents away from the learning site.</desc>
