<title id="task-1-13-breads-sandwich-design-title">Choose a bread that supports the whole sandwich</title>
<desc id="task-1-13-breads-sandwich-design-desc">Bread characteristics are matched with filling, service, portion and presentation needs to form a controlled sandwich specification. Rows compare neutral bread characteristics such as structure, moisture tolerance, flavour strength and handling. Columns connect filling texture, service context, portion and presentation. A product-specification panel shows verified information and teacher-confirmation gates.</desc>
