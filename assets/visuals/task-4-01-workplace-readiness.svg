<title id="task-4-01-workplace-readiness-title">Workplace readiness: prepare the whole service system</title>
<desc id="task-4-01-workplace-readiness-desc">Annotated beverage station showing current service information, clear access, protected ingredients, clean serviceware, an equipment check and a shortage that must be reported before service. A privacy-safe beverage station viewed at useful working scale with numbered callouts for people and access, information, ingredients, serviceware, equipment condition, hygiene controls and reporting points.</desc>
