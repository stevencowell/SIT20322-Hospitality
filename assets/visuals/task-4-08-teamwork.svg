<title id="task-4-08-teamwork-title">Teamwork: share information, support service and close the loop</title>
<desc id="task-4-08-teamwork-desc">Service-team map shows a fictional order change travelling from front of house to beverage production, being confirmed, updated for the customer and escalated to a supervisor when outside the team&apos;s authority. Front of house, beverage station, food production and supervisor surround a shared fictional order. Arrows show the authorised record, urgent verbal message, confirmation, customer update and end-of-shift handover.</desc>
