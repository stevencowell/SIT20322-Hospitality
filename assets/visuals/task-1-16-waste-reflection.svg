<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-1-16-waste-reflection-title task-1-16-waste-reflection-desc" data-layout="hierarchy-loop">
<title id="task-1-16-waste-reflection-title">Prevent first, separate safely, learn from the cause</title>
<desc id="task-1-16-waste-reflection-desc">Kitchen waste is prevented first, separated through authorised streams, recorded honestly and traced back to one production improvement. A descending hierarchy begins with Plan yield and prevent, then authorised protection or use, followed by local recycling or organics and safe disposal. A feedback arrow from the waste record identifies cause and returns one action to Ordering, Mise en place, Preparation, Storage or Portioning.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 14 5 L 0 10 Z" fill="#52666d" stroke="none"/></marker></defs>
