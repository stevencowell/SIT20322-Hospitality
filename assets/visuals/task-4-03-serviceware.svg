<title id="task-4-03-serviceware-title">Serviceware: select, inspect, present and clear</title>
<desc id="task-4-03-serviceware-desc">Serviceware inspection grid compares clean suitable items with soil, a chipped rim, a crack and an item that does not match the supplied product card. A large, high-contrast grid of representative cups, glasses, trays and cutlery with close-up insets showing clean, soiled, chipped, cracked and unsuitable handling examples.</desc>
