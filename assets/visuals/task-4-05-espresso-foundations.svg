<title id="task-4-05-espresso-foundations-title">Espresso foundations: product, equipment and customer language</title>
<desc id="task-4-05-espresso-foundations-desc">Labelled commercial espresso station identifies the grinder, hopper, group head, portafilter, basket, tamper, steam wand, milk jug and serviceware while directing operating details to teacher and manufacturer instructions. A clean, at-rest commercial station with callouts for grinder, hopper, group head, group handle or portafilter, basket, tamper, steam wand, jug and serviceware, plus a small family map that points to the current recipe card.</desc>
