<title id="task-1-14-sandwich-production-title">Build a sandwich through controlled layers</title>
<desc id="task-1-14-sandwich-production-desc">Sandwich layers align with recipe, preparation, safety, assembly, presentation, service and waste-control decisions. An exploded sandwich illustration aligns each product layer with the production stage beneath it: authorised recipe, bread check, prepared fillings, contamination and allergen controls, consistent assembly, protected presentation, then service or storage. A side stream shows prevention, reuse only as authorised and separated waste.</desc>
