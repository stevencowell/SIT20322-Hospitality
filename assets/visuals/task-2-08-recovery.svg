<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-2-08-recovery-title task-2-08-recovery-desc" data-layout="recovery-tree">
<title id="task-2-08-recovery-title">Recover service problems, manage conflict and use feedback</title>
<desc id="task-2-08-recovery-desc">Service recovery diagram moves from listening and clarification to routine action, supervisor decision or safety escalation, then follow-up and improvement recording. A complaint enters listen, clarify and repeat, then branches to routine authorised action, supervisor decision or safety escalation; all safe branches return to follow-up and factual improvement record.</desc>
