<title id="task-3-02-sectors-relationships-title">Sectors, services and working relationships</title>
<desc id="task-3-02-sectors-relationships-desc">Fictional hospitality customer journey connecting accommodation, food and beverage, events, transport and suppliers, with labelled information handovers and a closed-loop response to one change. A fictional regional function journey runs left to right from enquiry to departure. Coloured lanes show accommodation, food and beverage, event service and allied providers. Each arrow is labelled with the information or service handed over, and one disrupted connection expands into a closed-loop recovery inset.</desc>
