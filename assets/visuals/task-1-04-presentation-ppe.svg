<title id="task-1-04-presentation-ppe-title">Ready for the task, protected from the hazard</title>
<desc id="task-1-04-presentation-ppe-desc">Personal-presentation controls prepare a worker for food handling, while task hazards connect to specific authorised PPE and wider controls. A neutral worker silhouette has callouts for controlled hair, clean clothing, hands, footwear and removable personal items. Beside it, a hazard-to-PPE matrix distinguishes heat, chemical, cutting and splash tasks and shows that process controls remain in front of PPE.</desc>
