<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-1-08-tools-equipment-title task-1-08-tools-equipment-desc" data-layout="cycle">
<title id="task-1-08-tools-equipment-title">Select to store: the safe equipment loop</title>
<desc id="task-1-08-tools-equipment-desc">Kitchen equipment moves through selection, inspection, setup, operation, shutdown, cleaning and storage, with faults diverted to reporting. A seven-stage ring shows Select, Inspect, Set up, Operate, Stop, Clean and Store. Fault icons at inspection and operation exit to Keep from use and Report rather than re-entering the loop. Energy, guard, water and work-zone symbols provide visual checkpoints.</desc>
