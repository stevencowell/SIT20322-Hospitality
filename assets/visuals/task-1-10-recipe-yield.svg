<title id="task-1-10-recipe-yield-title">Scale the numbers, then test the kitchen plan</title>
<desc id="task-1-10-recipe-yield-desc">A recipe scaling calculation with units must pass equipment, batch, timing and waste checks before production. The left side shows Original yield, Required yield and Scaling factor with units attached to ingredient rows. A bridge leads to four practical gates: Equipment capacity, Batch method, Timing and Waste. A confirmation marker appears when any gate fails.</desc>
