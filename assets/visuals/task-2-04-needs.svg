<title id="task-2-04-needs-title">Match needs and wants through questions</title>
<desc id="task-2-04-needs-desc">Six-step customer-needs funnel moves from an open request to a verified product or service match and confirmation. A customer statement enters a funnel; open question, focused question, need/want/constraint sort, authorised information check, matched option and confirmation appear in sequence.</desc>
