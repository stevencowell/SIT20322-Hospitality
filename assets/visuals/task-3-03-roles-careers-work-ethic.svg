<title id="task-3-03-roles-careers-work-ethic-title">Roles, careers and work ethic</title>
<desc id="task-3-03-roles-careers-work-ethic-desc">Hospitality role evidence board showing duties, observable work ethic, authority boundaries, several possible career moves and separate official sources for occupation, training and employment questions. A central fictional hospitality role card links left to service duties and work-ethic evidence, right to possible related roles and learning steps, and down to three clearly separated source lanes for occupation, training and employment information.</desc>
