<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-1-03-hazards-controls-title task-1-03-hazards-controls-desc" data-layout="tree">
<title id="task-1-03-hazards-controls-title">From kitchen hazard to controlled action</title>
<desc id="task-1-03-hazards-controls-desc">Decision tree for observing a kitchen hazard, protecting people, acting only within training, reporting and reviewing the control. A branching diagram starts with Observe the hazard, then asks Immediate danger? and Within my training? Paths lead to warn and stop, isolate only as trained, report, authorised control and review. Side examples show slip, cut, heat, chemical and workload hazards without ranking them by invented numbers.</desc>
