<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-4-07-quality-title task-4-07-quality-desc" data-layout="quality-map">
<title id="task-4-07-quality-title">Quality: observe, diagnose, act and record</title>
<desc id="task-4-07-quality-desc">Quality decision map compares observable beverage and serviceware features, directs the learner to the current standard, and branches to accept, authorised adjustment, remake or report. Four paired close-ups show representative observable differences in extraction flow or crema, milk texture, serviceware cleanliness and finished presentation. Each pair feeds into observe, compare, act and record, without numeric targets.</desc>
