<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="task-4-04-orders-title task-4-04-orders-desc" data-layout="order-change">
<title id="task-4-04-orders-title">Orders: listen, record, relay and verify</title>
<desc id="task-4-04-orders-desc">Order communication trail shows a fictional request recorded, relayed to production, changed in the authorised record, confirmed by the receiver and verified before customer handover. A left-to-right flow from fictional customer request to authorised record, production acknowledgement, service verification and customer follow-up, including a clearly marked change loop.</desc>
