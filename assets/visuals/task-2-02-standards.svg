<title id="task-2-02-standards-title">Turn service standards into observable actions</title>
<desc id="task-2-02-standards-desc">Six hospitality service examples showing observable courtesy, promptness, product knowledge, accuracy, presentation and problem resolution. Privacy-safe close crops or staged illustrations of acknowledgement, accurate note-taking, presentation check, product-information check, delay update and escalation handover.</desc>
