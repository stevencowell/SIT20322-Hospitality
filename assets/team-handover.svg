<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Team communication handover loop</title><desc id="desc">Four roles form a loop around a shared service goal: front of house, beverage station, kitchen or production, and supervisor. Each handover confirms what changed, who owns the next action and when to check back.</desc><rect width="900" height="470" rx="24" fill="#eef6f6"/><text x="450" y="49" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#073d48">A useful handover closes the communication loop</text><g font-family="Segoe UI,Arial"><circle cx="450" cy="255" r="93" fill="#0b5261"/><text x="450" y="245" text-anchor="middle" font-size="22" font-weight="800" fill="white">SHARED</text><text x="450" y="274" text-anchor="middle" font-size="18" fill="#e5f1f2">SERVICE GOAL</text><g fill="white" stroke="#bfd3d6" stroke-width="2"><rect x="70" y="115" width="230" height="80" rx="18"/><rect x="600" y="115" width="230" height="80" rx="18"/><rect x="600" y="320" width="230" height="80" rx="18"/><rect x="70" y="320" width="230" height="80" rx="18"/></g><g text-anchor="middle" fill="#073d48"><text x="185" y="150" font-size="18" font-weight="800">Front of house</text><text x="185" y="176" font-size="14" fill="#52666d">orders · timing · customer</text><text x="715" y="150" font-size="18" font-weight="800">Beverage station</text><text x="715" y="176" font-size="14" fill="#52666d">queue · quality · shortages</text><text x="715" y="355" font-size="18" font-weight="800">Kitchen / production</text><text x="715" y="381" font-size="14" fill="#52666d">allergens · progress · handover</text><text x="185" y="355" font-size="18" font-weight="800">Supervisor</text><text x="185" y="381" font-size="14" fill="#52666d">priorities · authority · support</text></g><g stroke="#d9ab3d" stroke-width="6" fill="none" stroke-linecap="round"><path d="M300 155c80-62 220-62 300 0"/><path d="M760 195c34 42 34 83 0 125"/><path d="M600 360c-80 62-220 62-300 0"/><path d="M140 320c-34-42-34-83 0-125"/></g><rect x="240" y="420" width="420" height="35" rx="18" fill="#17663e"/><text x="450" y="443" text-anchor="middle" font-size="15" font-weight="700" fill="white">What changed? Who owns the next action? When will we check?</text></g></svg>
