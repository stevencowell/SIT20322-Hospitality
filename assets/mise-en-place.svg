<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Mise en place workflow</title><desc id="desc">A clockwise workflow shows reading the whole recipe, calculating quantities, gathering equipment, preparing ingredients, arranging a safe workspace and checking before service.</desc><rect width="900" height="470" rx="24" fill="#f3f8f8"/><text x="450" y="48" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#073d48">Mise en place: every item ready for the next action</text><g font-family="Segoe UI,Arial"><circle cx="450" cy="265" r="92" fill="#0b5261"/><text x="450" y="252" text-anchor="middle" font-size="24" font-weight="800" fill="white">READY</text><text x="450" y="282" text-anchor="middle" font-size="17" fill="#e5f1f2">safe · ordered · efficient</text><g fill="white" stroke="#bfd3d6" stroke-width="2"><rect x="345" y="78" width="210" height="74" rx="16"/><rect x="610" y="150" width="220" height="74" rx="16"/><rect x="610" y="320" width="220" height="74" rx="16"/><rect x="70" y="320" width="220" height="74" rx="16"/><rect x="70" y="150" width="220" height="74" rx="16"/></g><g fill="#073d48" font-weight="700" font-size="17" text-anchor="middle"><text x="450" y="108">1. Read the whole recipe</text><text x="450" y="132" font-size="14" font-weight="400" fill="#52666d">method · yield · timing · safety</text><text x="720" y="180">2. Calculate and gather</text><text x="720" y="204" font-size="14" font-weight="400" fill="#52666d">ingredients · tools · equipment</text><text x="720" y="350">3. Prepare ingredients</text><text x="720" y="374" font-size="14" font-weight="400" fill="#52666d">measure · wash · cut · label</text><text x="180" y="350">4. Arrange the station</text><text x="180" y="374" font-size="14" font-weight="400" fill="#52666d">safe zones · waste · workflow</text><text x="180" y="180">5. Final pre-start check</text><text x="180" y="204" font-size="14" font-weight="400" fill="#52666d">missing items · hazards · sequence</text></g><g fill="none" stroke="#d9ab3d" stroke-width="7" stroke-linecap="round"><path d="M560 115c55 15 87 35 117 64"/><path d="M794 232c8 28 8 48 0 78"/><path d="M598 367c-35 26-59 36-93 42"/><path d="M305 372c-38-22-61-40-82-72"/><path d="M112 236c13-30 34-57 65-80"/></g></g></svg>
