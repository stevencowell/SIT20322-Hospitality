<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Four-question source check</title><desc id="desc">Four panels ask who published it, when it was updated, whether it answers the question, and how it changes a workplace action.</desc><rect width="900" height="470" rx="24" fill="#f3f8f8"/><text x="450" y="50" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#073d48">A source becomes useful when you can test it and apply it</text><g font-family="Segoe UI,Arial"><g transform="translate(55 100)"><rect width="370" height="120" rx="18" fill="#0b5261"/><text x="30" y="42" font-size="18" font-weight="800" fill="#f1cd70">AUTHORITY</text><text x="30" y="76" font-size="22" font-weight="700" fill="white">Who published it?</text><text x="30" y="101" font-size="15" fill="#e5f1f2">Government · regulator · industry body · workplace</text></g><g transform="translate(475 100)"><rect width="370" height="120" rx="18" fill="#0f6878"/><text x="30" y="42" font-size="18" font-weight="800" fill="#f1cd70">CURRENCY</text><text x="30" y="76" font-size="22" font-weight="700" fill="white">When was it updated?</text><text x="30" y="101" font-size="15" fill="#e5f1f2">Check current status, date, version and jurisdiction</text></g><g transform="translate(55 250)"><rect width="370" height="120" rx="18" fill="#167f8f"/><text x="30" y="42" font-size="18" font-weight="800" fill="#fff5d8">RELEVANCE</text><text x="30" y="76" font-size="22" font-weight="700" fill="white">Does it answer the question?</text><text x="30" y="101" font-size="15" fill="white">Use the exact workplace issue, role and context</text></g><g transform="translate(475 250)"><rect width="370" height="120" rx="18" fill="#d9ab3d"/><text x="30" y="42" font-size="18" font-weight="800" fill="#073d48">APPLICATION</text><text x="30" y="76" font-size="22" font-weight="700" fill="#073d48">What action changes?</text><text x="30" y="101" font-size="15" fill="#5f4811">Explain a decision, responsibility or service practice</text></g><rect x="260" y="402" width="380" height="40" rx="20" fill="#17663e"/><text x="450" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="white">Record organisation · title · date · link · finding</text></g></svg>
