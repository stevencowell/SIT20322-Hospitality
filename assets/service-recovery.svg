<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Six-step service recovery process</title><desc id="desc">Six connected steps: listen, clarify, repeat, offer an authorised solution, apologise when appropriate and follow up.</desc><rect width="900" height="470" rx="24" fill="#f3f8f8"/><text x="450" y="48" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#073d48">A calm complaint response protects the customer and the team</text><g font-family="Segoe UI,Arial"><g transform="translate(55 100)"><circle cx="95" cy="95" r="72" fill="#0b5261"/><text x="95" y="88" text-anchor="middle" font-size="20" font-weight="800" fill="white">1. Listen</text><text x="95" y="115" text-anchor="middle" font-size="14" fill="#e5f1f2">Do not interrupt</text></g><g transform="translate(255 100)"><circle cx="95" cy="95" r="72" fill="#0f6878"/><text x="95" y="88" text-anchor="middle" font-size="20" font-weight="800" fill="white">2. Clarify</text><text x="95" y="115" text-anchor="middle" font-size="14" fill="#e5f1f2">Ask what happened</text></g><g transform="translate(455 100)"><circle cx="95" cy="95" r="72" fill="#167f8f"/><text x="95" y="88" text-anchor="middle" font-size="20" font-weight="800" fill="white">3. Repeat</text><text x="95" y="115" text-anchor="middle" font-size="14" fill="white">Check understanding</text></g><g transform="translate(655 100)"><circle cx="95" cy="95" r="72" fill="#d9ab3d"/><text x="95" y="88" text-anchor="middle" font-size="20" font-weight="800" fill="#073d48">4. Solve</text><text x="95" y="115" text-anchor="middle" font-size="14" fill="#5f4811">Within your authority</text></g><g transform="translate(255 285)"><rect width="190" height="92" rx="20" fill="#fff" stroke="#bfd3d6" stroke-width="2"/><text x="95" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#073d48">5. Apologise</text><text x="95" y="66" text-anchor="middle" font-size="14" fill="#52666d">When appropriate</text></g><g transform="translate(455 285)"><rect width="190" height="92" rx="20" fill="#17663e"/><text x="95" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="white">6. Follow up</text><text x="95" y="66" text-anchor="middle" font-size="14" fill="#e9f7ef">Check satisfaction</text></g><path d="M750 278c-12 62-42 79-95 79M455 331h-10" fill="none" stroke="#d9ab3d" stroke-width="7" stroke-linecap="round"/><rect x="180" y="407" width="540" height="40" rx="20" fill="#0b5261"/><text x="450" y="433" text-anchor="middle" font-size="16" font-weight="700" fill="white">Escalate promptly when the request is unsafe, serious or outside your authority.</text></g></svg>
