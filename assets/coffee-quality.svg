<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Coffee quality troubleshooting matrix</title><desc id="desc">A matrix links observed quality problems to variables to check: recipe and dose, grind and distribution, extraction, milk and presentation, equipment cleanliness and freshness.</desc><rect width="900" height="470" rx="24" fill="#f4f0ea"/><text x="450" y="49" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#4b2d1d">Troubleshoot from evidence—change one authorised variable at a time</text><g font-family="Segoe UI,Arial"><rect x="50" y="92" width="800" height="310" rx="18" fill="white" stroke="#cbbbab" stroke-width="2"/><path d="M300 92v310M50 155h800M50 217h800M50 279h800M50 341h800" stroke="#d9d0c6" stroke-width="2"/><rect x="50" y="92" width="800" height="63" rx="18" fill="#4b2d1d"/><text x="175" y="131" text-anchor="middle" font-size="18" font-weight="800" fill="white">Observe</text><text x="575" y="131" text-anchor="middle" font-size="18" font-weight="800" fill="white">Check before changing anything</text><g font-size="16"><text x="75" y="194" font-weight="700" fill="#4b2d1d">Flow too fast or too slow</text><text x="325" y="194" fill="#52666d">Recipe, dose, grind, distribution and tamp consistency</text><text x="75" y="256" font-weight="700" fill="#4b2d1d">Weak, harsh or unbalanced cup</text><text x="325" y="256" fill="#52666d">Freshness, recipe, extraction and clean equipment</text><text x="75" y="318" font-weight="700" fill="#4b2d1d">Large-bubbled or flat milk</text><text x="325" y="318" fill="#52666d">Milk selection, starting condition, technique and wand cleanliness</text><text x="75" y="380" font-weight="700" fill="#4b2d1d">Order looks wrong at handover</text><text x="325" y="380" fill="#52666d">Order confirmation, cup, presentation and service sequence</text></g><rect x="205" y="420" width="490" height="34" rx="17" fill="#0b5261"/><text x="450" y="443" text-anchor="middle" font-size="15" font-weight="700" fill="white">Record the observation, adjustment, result and next action.</text></g></svg>
