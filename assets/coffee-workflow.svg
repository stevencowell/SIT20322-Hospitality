<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Espresso coffee workflow</title><desc id="desc">Seven connected steps: confirm the order, prepare the station, dose and distribute, tamp consistently, extract and observe, texture milk if required, present and check.</desc><rect width="900" height="470" rx="24" fill="#f4f0ea"/><text x="450" y="48" text-anchor="middle" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#4b2d1d">One order, one controlled workflow</text><g font-family="Segoe UI,Arial"><g transform="translate(35 105)"><rect width="112" height="210" rx="18" fill="#4b2d1d"/><circle cx="56" cy="48" r="27" fill="#d9ab3d"/><text x="56" y="57" text-anchor="middle" font-size="23" font-weight="800" fill="#4b2d1d">1</text><text x="56" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">Confirm</text><text x="56" y="130" text-anchor="middle" font-size="13" fill="#f7eadf">drink · size</text><text x="56" y="151" text-anchor="middle" font-size="13" fill="#f7eadf">milk · extras</text></g><g transform="translate(157 105)"><rect width="112" height="210" rx="18" fill="#69412a"/><circle cx="56" cy="48" r="27" fill="#d9ab3d"/><text x="56" y="57" text-anchor="middle" font-size="23" font-weight="800" fill="#4b2d1d">2</text><text x="56" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">Prepare</text><text x="56" y="130" text-anchor="middle" font-size="13" fill="#f7eadf">clean station</text><text x="56" y="151" text-anchor="middle" font-size="13" fill="#f7eadf">cup · tools</text></g><g transform="translate(279 105)"><rect width="112" height="210" rx="18" fill="#81523a"/><circle cx="56" cy="48" r="27" fill="#d9ab3d"/><text x="56" y="57" text-anchor="middle" font-size="23" font-weight="800" fill="#4b2d1d">3</text><text x="56" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">Dose</text><text x="56" y="130" text-anchor="middle" font-size="13" fill="#f7eadf">grind · dose</text><text x="56" y="151" text-anchor="middle" font-size="13" fill="#f7eadf">distribute</text></g><g transform="translate(401 105)"><rect width="112" height="210" rx="18" fill="#976649"/><circle cx="56" cy="48" r="27" fill="#d9ab3d"/><text x="56" y="57" text-anchor="middle" font-size="23" font-weight="800" fill="#4b2d1d">4</text><text x="56" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">Tamp</text><text x="56" y="130" text-anchor="middle" font-size="13" fill="#fff">level</text><text x="56" y="151" text-anchor="middle" font-size="13" fill="#fff">consistent</text></g><g transform="translate(523 105)"><rect width="112" height="210" rx="18" fill="#0b5261"/><circle cx="56" cy="48" r="27" fill="#d9ab3d"/><text x="56" y="57" text-anchor="middle" font-size="23" font-weight="800" fill="#073d48">5</text><text x="56" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">Extract</text><text x="56" y="130" text-anchor="middle" font-size="13" fill="#e5f1f2">observe</text><text x="56" y="151" text-anchor="middle" font-size="13" fill="#e5f1f2">follow recipe</text></g><g transform="translate(645 105)"><rect width="112" height="210" rx="18" fill="#167f8f"/><circle cx="56" cy="48" r="27" fill="#d9ab3d"/><text x="56" y="57" text-anchor="middle" font-size="23" font-weight="800" fill="#073d48">6</text><text x="56" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">Texture</text><text x="56" y="130" text-anchor="middle" font-size="13" fill="white">correct milk</text><text x="56" y="151" text-anchor="middle" font-size="13" fill="white">fine texture</text></g><g transform="translate(767 105)"><rect width="98" height="210" rx="18" fill="#17663e"/><circle cx="49" cy="48" r="27" fill="#d9ab3d"/><text x="49" y="57" text-anchor="middle" font-size="23" font-weight="800" fill="#073d48">7</text><text x="49" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="white">Serve</text><text x="49" y="130" text-anchor="middle" font-size="13" fill="#e9f7ef">present</text><text x="49" y="151" text-anchor="middle" font-size="13" fill="#e9f7ef">check</text></g><rect x="178" y="357" width="544" height="65" rx="17" fill="#fff" stroke="#cbbbab" stroke-width="2"/><text x="450" y="385" text-anchor="middle" font-size="17" font-weight="700" fill="#4b2d1d">Use the current workplace recipe and machine procedure.</text><text x="450" y="408" text-anchor="middle" font-size="14" fill="#6d594d">Never guess a dose, yield, time, temperature or cleaning chemical.</text></g></svg>
