<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Clean then sanitise sequence</title><desc id="desc">Five steps show clearing food and debris, washing with the approved product, rinsing if required, sanitising for the correct contact time and allowing the surface to air dry.</desc><rect width="900" height="460" rx="24" fill="#eef6f6"/><text x="450" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#073d48">Cleaning removes soil. Sanitising reduces microorganisms.</text><g font-family="Segoe UI,Arial"><g transform="translate(30 105)"><rect width="150" height="230" rx="18" fill="white" stroke="#bfd3d6" stroke-width="2"/><circle cx="75" cy="56" r="31" fill="#0b5261"/><text x="75" y="66" text-anchor="middle" font-size="27" font-weight="800" fill="white">1</text><text x="75" y="117" text-anchor="middle" font-size="19" font-weight="700" fill="#073d48">Clear</text><text x="75" y="148" text-anchor="middle" font-size="14" fill="#52666d">Remove food, tools</text><text x="75" y="170" text-anchor="middle" font-size="14" fill="#52666d">and loose debris</text></g><g transform="translate(202 105)"><rect width="150" height="230" rx="18" fill="white" stroke="#bfd3d6" stroke-width="2"/><circle cx="75" cy="56" r="31" fill="#0f6878"/><text x="75" y="66" text-anchor="middle" font-size="27" font-weight="800" fill="white">2</text><text x="75" y="117" text-anchor="middle" font-size="19" font-weight="700" fill="#073d48">Wash</text><text x="75" y="148" text-anchor="middle" font-size="14" fill="#52666d">Use the approved</text><text x="75" y="170" text-anchor="middle" font-size="14" fill="#52666d">cleaning product</text></g><g transform="translate(374 105)"><rect width="150" height="230" rx="18" fill="white" stroke="#bfd3d6" stroke-width="2"/><circle cx="75" cy="56" r="31" fill="#167f8f"/><text x="75" y="66" text-anchor="middle" font-size="27" font-weight="800" fill="white">3</text><text x="75" y="117" text-anchor="middle" font-size="19" font-weight="700" fill="#073d48">Rinse</text><text x="75" y="148" text-anchor="middle" font-size="14" fill="#52666d">Follow the label</text><text x="75" y="170" text-anchor="middle" font-size="14" fill="#52666d">and procedure</text></g><g transform="translate(546 105)"><rect width="150" height="230" rx="18" fill="white" stroke="#bfd3d6" stroke-width="2"/><circle cx="75" cy="56" r="31" fill="#d9ab3d"/><text x="75" y="66" text-anchor="middle" font-size="27" font-weight="800" fill="#073d48">4</text><text x="75" y="117" text-anchor="middle" font-size="19" font-weight="700" fill="#073d48">Sanitise</text><text x="75" y="148" text-anchor="middle" font-size="14" fill="#52666d">Correct dilution</text><text x="75" y="170" text-anchor="middle" font-size="14" fill="#52666d">and contact time</text></g><g transform="translate(718 105)"><rect width="150" height="230" rx="18" fill="white" stroke="#bfd3d6" stroke-width="2"/><circle cx="75" cy="56" r="31" fill="#17663e"/><text x="75" y="66" text-anchor="middle" font-size="27" font-weight="800" fill="white">5</text><text x="75" y="117" text-anchor="middle" font-size="19" font-weight="700" fill="#073d48">Dry</text><text x="75" y="148" text-anchor="middle" font-size="14" fill="#52666d">Air dry unless the</text><text x="75" y="170" text-anchor="middle" font-size="14" fill="#52666d">procedure says otherwise</text></g><rect x="155" y="368" width="590" height="55" rx="14" fill="#0b5261"/><text x="450" y="401" text-anchor="middle" font-size="17" font-weight="700" fill="white">Never guess the chemical, dilution or contact time—check the label, SDS and workplace procedure.</text></g></svg>
